name: Circuit checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: RP2040 source and driver safety checks
        run: |
          bunx tsci build index.circuit.tsx --routing-disabled --disable-parts-engine
          bun run typecheck
          bun run check:source-schematic
          bun run check:firmware-pins
          bun run check:firmware
          bun run check:firmware-target
          bun test scripts/rp2040-contract.test.mjs scripts/encoder-bypass-policy.test.mjs scripts/verify-programming.test.mjs
          bun run check:decoupling
          bun run check:schematic-style
      - name: CC protection alias regression
        run: bun test scripts/cc-protection-aliases.test.mjs
      - name: Placement regression without generated logs
        run: bun test scripts/placement-review.test.mjs
      - name: Check committed harness across runtimes
        run: |
          bun scripts/generate-harness-assembly.mjs --check
          node scripts/generate-harness-assembly.mjs --check
      - run: bun run review
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pd1180-epr-checks
          path: |
            dist/
            docs/checks/
            docs/*-check.json
            routing/fingerprint.json
            release/
          retention-days: 14
