[platformio]
src_dir = .
include_dir = include

[env:pd1180]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#5d4561a05e3b212660ac6fdd3fbfb328d1988aa1
board = generic
framework = arduino
board_build.core = earlephilhower
board_build.f_cpu = 125000000L
board_build.arduino.earlephilhower.boot2_source = boot2_w25q080_2_padded_checksum.S
board_upload.maximum_size = 4194304
board_build.filesystem_size = 0
upload_protocol = picotool
build_src_filter = +<src/power_domain.c> +<src/control.c> +<src/brake_preflight.c> +<src/telemetry.c> +<src/pd_contract.c> +<src/pd_voltage.c> +<src/drv8262.c> +<src/step_motion.c> +<src/as5600.c> +<target/*.cpp>
build_flags =
  -D USE_TINYUSB
  -D NO_USB
